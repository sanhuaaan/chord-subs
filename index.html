<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sustituciones de acordes</title>
  <script type="importmap">
    { "imports": { "tonal": "https://esm.sh/tonal@6" } }
  </script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #1c1c22;
      color: #e8e8ee;
    }
    h1 { font-size: 1.4rem; }
    .tabs { display: flex; gap: 0.25rem; margin-top: 1rem; border-bottom: 0.0625rem solid #333; }
    .tabs label {
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      border-radius: 0.375rem 0.375rem 0 0;
      color: #a8a8b8;
    }
    #tab-subs:checked ~ .tabs label[for="tab-subs"],
    #tab-capo:checked ~ .tabs label[for="tab-capo"] { background: #2a2a33; color: #e8e8ee; }
    #subs, #capo { display: none; list-style: none; padding: 0; }
    #tab-subs:checked ~ #subs, #tab-capo:checked ~ #capo { display: block; }
    #subs li, #capo li { padding: 0.4rem 0; border-bottom: 0.0625rem solid #333; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input {
      flex: 1;
      font-size: 1.1rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      border: 0.0625rem solid #555;
      background: #2a2a33;
      color: inherit;
    }
    button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: none;
      background: #4a6cd4;
      color: white;
      cursor: pointer;
    }
    .original { font-weight: bold; }
    .key { margin: 0.25rem 0 0.75rem; font-size: 0.85rem; color: #a8a8b8; }
    small { color: #999; }
    .why { margin: 0.25rem 0 0; font-size: 0.85rem; color: #a8a8b8; }
    .chord { position: relative; text-decoration: underline dotted; text-underline-offset: 0.2rem; }
    .chord .tip {
      display: none;
      position: absolute;
      left: 0;
      top: 1.5rem;
      z-index: 1;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #2a2a33;
      border: 0.0625rem solid #555;
      border-radius: 0.375rem;
    }
    .chord:hover .tip { display: flex; }
    .tip svg { width: 4.5rem; height: auto; }
    #error { color: #e07070; }
  </style>
</head>
<body>
  <h1>Sustituciones de acordes</h1>
  <form>
    <input id="progression" placeholder="Ej.: C Am F G7" autofocus>
    <button type="submit">Sugerir</button>
  </form>
  <p id="error"></p>
  <div id="summary"></div>
  <input type="radio" name="tab" id="tab-subs" checked hidden>
  <input type="radio" name="tab" id="tab-capo" hidden>
  <nav class="tabs">
    <label for="tab-subs">Sustituciones</label>
    <label for="tab-capo">Cejilla</label>
  </nav>
  <ul id="subs"></ul>
  <ul id="capo"></ul>
  <script type="module" src="./app.js"></script>
</body>
</html>
